name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CGO_ENABLED: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Cache llama.cpp headers
        uses: actions/cache@v6
        with:
          path: llama-cpp
          key: llama-cpp-${{ hashFiles('go.mod') }}

      - name: Fetch llama.cpp headers
        run: make fetch-headers

      - name: check that 'go mod tidy' is clean
        run: go mod tidy --diff || (echo "Please run 'go mod tidy'." && exit 1)

      - uses: golangci/golangci-lint-action@v9
        with:
          only-new-issues: true

      - name: Run hadolint with reviewdog
        uses: reviewdog/action-hadolint@v1.51.0

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Cache llama.cpp deps
        uses: actions/cache@v6
        with:
          path: llama-cpp
          key: llama-cpp-${{ hashFiles('go.mod') }}

      # The runner has no ollama install, so source libllama.so from the ollama
      # image pinned to go.mod (tag has no leading "v").
      - name: Derive ollama image tag from go.mod
        id: ver
        run: echo "tag=$(awk '/github\.com\/ollama\/ollama/ {print $2}' go.mod | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: Cache ollama libs
        id: ollama-libs
        uses: actions/cache@v6
        with:
          path: ollama-libs
          key: ollama-libs-${{ steps.ver.outputs.tag }}

      - name: Extract pinned ollama libs
        if: steps.ollama-libs.outputs.cache-hit != 'true'
        run: |
          id=$(docker create ollama/ollama:${{ steps.ver.outputs.tag }})
          docker cp "$id":/usr/lib/ollama ./ollama-libs
          docker rm "$id" >/dev/null

      - name: Build
        run: make build OLLAMA_LIB_DIR=./ollama-libs

  docker-build:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Derive ollama image tag from go.mod
        id: ver
        run: echo "ver=$(awk '/github\.com\/ollama\/ollama/ {print $2}' go.mod)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: OLLAMA_VERSION=${{ steps.ver.outputs.ver }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    needs: build
    runs-on: ubuntu-latest
    env:
      OLLAMA_MODELS: '/home/runner/.ollama'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Cache llama.cpp deps
        uses: actions/cache@v6
        with:
          path: llama-cpp
          key: llama-cpp-${{ hashFiles('go.mod') }}

      - name: Derive ollama image tag from go.mod
        id: ver
        run: echo "tag=$(awk '/github\.com\/ollama\/ollama/ {print $2}' go.mod | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: Cache ollama libs
        id: ollama-libs
        uses: actions/cache@v6
        with:
          path: ollama-libs
          key: ollama-libs-${{ steps.ver.outputs.tag }}

      - name: Extract pinned ollama libs
        if: steps.ollama-libs.outputs.cache-hit != 'true'
        run: |
          id=$(docker create ollama/ollama:${{ steps.ver.outputs.tag }})
          docker cp "$id":/usr/lib/ollama ./ollama-libs
          docker rm "$id" >/dev/null

      - name: Restore ollama models cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.OLLAMA_MODELS }}
          key: ${{ runner.os }}-ollama
          restore-keys: |
            ${{ runner.os }}-ollama-

      - name: Setup Ollama
        uses: ai-action/setup-ollama@v2

      - name: Pull tinyllama
        run: ollama pull tinyllama:1.1b

      - name: Compute model digest
        id: digest
        run: echo "hash=$(find "$OLLAMA_MODELS" -type f -exec sha256sum {} + | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save ollama models cache
        uses: actions/cache/save@v6
        with:
          path: ${{ env.OLLAMA_MODELS }}
          key: ${{ runner.os }}-ollama-${{ steps.digest.outputs.hash }}

      # The test binary loads libllama at runtime from the default /usr/lib/ollama;
      # point it at the pinned libs we extracted so our tokenizer .so matches go.mod.
      - name: go test
        run: LD_LIBRARY_PATH="$PWD/ollama-libs" make build OLLAMA_LIB_DIR=./ollama-libs && LD_LIBRARY_PATH="$PWD/ollama-libs" OLLAMATOKENIZER_TEST_MODELS=tinyllama:1.1b go test -v -timeout 20m
